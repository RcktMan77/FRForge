name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      - name: CLI smoke (JSON report skeleton)
        run: |
          chmod +x bin/frforge
          ./bin/frforge test --report results/ci/report.json --suite smoke
          test -f results/ci/report.json
          julia --project=. -e '
            using FRForge, JSON
            r = JSON.parsefile("results/ci/report.json")
            errs = validate_report_keys(r)
            isempty(errs) || error(join(errs, "; "))
            println("CLI report OK: schema_version=", r["schema_version"])
          '
