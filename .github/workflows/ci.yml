name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this event touches package code (vs docs/assets only).
  changes:
    name: Change detection
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.set.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'Project.toml'
              - 'Manifest.toml'
              - 'bin/**'
              - '.github/workflows/**'
              - 'scripts/**/*.jl'
      - name: Set code output
        id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Always full suite on pushes to main/develop
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            # PRs: dorny/paths-filter sets steps.filter.outputs.code
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

  # Required check names stay "Julia 1.10/1.11 - ubuntu-latest" for branch protection.
  # Docs-only PRs run a package-load smoke under the same job names.
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - name: Full Pkg.test (code paths)
        if: needs.changes.outputs.code == 'true'
        uses: julia-actions/julia-runtest@v1

      - name: CLI smoke (code paths)
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x bin/frforge
          ./bin/frforge test --report results/ci/report.json --suite smoke
          test -f results/ci/report.json
          julia --project=. -e '
            using FRForge, JSON
            r = JSON.parsefile("results/ci/report.json")
            errs = validate_report_keys(r)
            isempty(errs) || error(join(errs, "; "))
            println("CLI report OK: schema_version=", r["schema_version"])
          '

      - name: Package load smoke (docs-only PR)
        if: needs.changes.outputs.code != 'true'
        run: |
          julia --project=. -e 'using FRForge; println("docs-only CI smoke OK schema=", FRForge.SCHEMA_VERSION)'
